name: Cimientos
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: backend
  postgres_integracion:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: broquer_test
          POSTGRES_PASSWORD: ci_disposable_only
          POSTGRES_DB: broquer_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U broquer_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BROQUER_CI_DISPOSABLE: 'true'
      MIGRATIONS_DATABASE_URL: postgresql://broquer_test:ci_disposable_only@localhost:5432/broquer_test
      BROQUER_TEST_DATABASE_URL: postgresql://broquer_test:ci_disposable_only@localhost:5432/broquer_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements-dev.txt
      - run: python backend/tests/preparar_ci.py
      - run: python backend/migrar.py
      - run: python -m pytest tests/test_postgres.py -q
        working-directory: backend
  aislamiento_sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: backend/tests/sql
      - run: node backend/tests/sql/rls.mjs
  interfaz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
      - run: pnpm mobile:build
